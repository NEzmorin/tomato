<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<meta name="description" content="Выбери слово, выбери снаряд и отправь его точно в цель.">
<title>ТОМАТ — сайт для метких</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#111520;--panel2:#171d2a;--line:#252d3d;--muted:#8993a6;--blue:#347eff;--red:#ff5d59;--white:#f4f6fb}
*{box-sizing:border-box}
html,body{margin:0;min-width:320px;min-height:100%;background:var(--bg);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100svh;background:radial-gradient(ellipse at 50% 38%,rgba(36,80,150,.16),transparent 48%),var(--bg)}
button,input{font:inherit}
.app{width:min(900px,100% - 32px);margin:0 auto;padding:22px 0 max(24px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:950;letter-spacing:.12em}
.logo{display:grid;place-items:center;width:36px;height:36px;border:1px solid #392b35;border-radius:12px;background:#21151d;font-size:20px}
.tag{color:#778197;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:15px}
h1{margin:0;font-size:clamp(25px,5vw,38px);line-height:1;letter-spacing:-.06em;font-weight:950}
h1 span{color:var(--red)}
.subtitle{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
.live{display:flex;align-items:center;gap:7px;color:#aab3c3;font-size:10px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:#4bd49a;box-shadow:0 0 12px #4bd49a}
.stage{position:relative;overflow:hidden;border:1px solid #222b3a;border-radius:24px;background:#0d1422;box-shadow:0 22px 70px rgba(0,0,0,.28)}
canvas{display:block;width:100%;height:clamp(390px,58svh,610px);touch-action:manipulation;cursor:crosshair}
.stage-tip{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);padding:9px 13px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(8,12,20,.76);color:#aeb9cd;font-size:10px;font-weight:750;white-space:nowrap;pointer-events:none;backdrop-filter:blur(10px)}
.stage-tip b{color:#fff}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin-top:13px}
.panel{min-width:0;padding:15px;border:1px solid var(--line);border-radius:17px;background:var(--panel)}
.label{display:block;margin-bottom:9px;color:#a5aec0;font-size:9px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
.name-row{display:flex;gap:8px}
input{width:100%;min-width:0;height:42px;padding:0 12px;border:1px solid #30394a;border-radius:11px;outline:none;background:#0b101a;color:#fff;font-size:14px;font-weight:750}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #347eff25}
.apply,.clear{height:42px;padding:0 14px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:11px;font-weight:900;white-space:nowrap;cursor:pointer}
.clear{background:#202838;border:1px solid #30394a;color:#c5ccda}
.apply:active,.clear:active,.weapon:active{transform:scale(.97)}
.weapon-panel{margin-top:13px}
.weapon-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.weapon{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:8px 10px;border:1px solid #2a3344;border-radius:13px;background:#101622;color:#e7ebf3;cursor:pointer;transition:.15s}
.weapon[aria-pressed=true]{border-color:#4c8cff;background:#152442;box-shadow:inset 0 0 0 1px #347eff33}
.weapon .emoji{font-size:22px}
.weapon .wname{font-size:11px;font-weight:850}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding:0 3px;color:#8d98aa;font-size:11px}
.status strong{color:#e6eaf2;font-weight:800}
@media(max-width:600px){
 .app{width:calc(100% - 22px);padding-top:max(13px,env(safe-area-inset-top))}
 header{margin-bottom:17px}.tag{font-size:8px}
 .intro{margin-bottom:12px}.subtitle{max-width:250px;font-size:11px}
 .stage{border-radius:19px}
 canvas{height:clamp(390px,56svh,560px)}
 .stage-tip{bottom:10px;font-size:9px}
 .controls{grid-template-columns:1fr;gap:9px;margin-top:9px}
 .panel{padding:12px;border-radius:15px}
 .weapon-panel{margin-top:9px}
 .weapon-list{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
 .weapon{flex-direction:column;gap:3px;min-height:61px;padding:7px 2px}
 .weapon .emoji{font-size:21px}.weapon .wname{font-size:9px}
 .status{margin-top:10px;font-size:10px}
}
@media(max-width:360px){.weapon .wname{font-size:8px}.apply{padding:0 10px;font-size:10px}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand"><span class="logo">🍅</span><span>ТОМАТ / <span style="color:var(--red)">НЕ ПРИНИМАЙ ВСЕРЬЁЗ</span></span></div><div class="tag">серьёзность отменяется</div></header>
<section class="intro"><div><h1>ТВОЯ ЦЕЛЬ — <span id="headline">«С»</span></h1><p class="subtitle">Выбери предмет и ткни в любое место. Остальное — физика (почти).</p></div><div class="live"><i></i> ВСЁ ГОТОВО</div></section>
<section class="stage" aria-label="Поле для бросков">
<canvas id="field" aria-label="Нажми или коснись экрана, чтобы бросить выбранный предмет в это место"></canvas>
<div class="stage-tip"><b>ТЫКНИ</b> В ТОЧКУ — СНАРЯД ТУДА И ПОЛЕТИТ</div>
</section>
<section class="controls">
<div class="panel">
<label class="label" for="word">КТО СЕГОДНЯ МИШЕНЬ?</label>
<div class="name-row"><input id="word" maxlength="18" value="С" placeholder="Имя или любое слово"><button class="apply" id="setWord">Поставить</button></div>
</div>
<div class="panel" style="min-width:120px">
<label class="label">ПОПАДАНИЯ</label>
<div style="font-size:25px;font-weight:950;letter-spacing:-.06em" id="count">0</div>
</div>
</section>
<section class="panel weapon-panel">
<label class="label">ВЫБЕРИ, ЧЕМ ЗАПУСТИТЬ</label>
<div class="weapon-list">
<button class="weapon" data-item="tomato" aria-pressed="true"><span class="emoji">🍅</span><span class="wname">Помидор</span></button>
<button class="weapon" data-item="egg" aria-pressed="false"><span class="emoji">🥚</span><span class="wname">Яйцо</span></button>
<button class="weapon" data-item="orange" aria-pressed="false"><span class="emoji">🍊</span><span class="wname">Апельсин</span></button>
<button class="weapon" data-item="water" aria-pressed="false"><span class="emoji">💧</span><span class="wname">Шар</span></button>
<button class="weapon" data-item="sponge" aria-pressed="false"><span class="emoji">🧽</span><span class="wname">Губка</span></button>
</div>
</section>
<div class="status"><span id="message"><strong>Готово.</strong> Выбирай точку назначения.</span><button class="clear" id="clear">Очистить следы</button></div>
</main>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("field"),ctx=canvas.getContext("2d");
const items={tomato:{emoji:"🍅",color:"#e94b45"},egg:{emoji:"🥚",color:"#f3dfb5"},orange:{emoji:"🍊",color:"#ff982e"},water:{emoji:"💧",color:"#57cafa"},sponge:{emoji:"🧽",color:"#f1d447"}};
let selected="tomato",word="С",shots=[],splats=[],particles=[],count=0,last=0;
const W=800,H=600,C={x:400,y:278,r:112},origin={x:400,y:575};
const $=id=>document.getElementById(id);
function resize(){
 const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
 ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);draw();
}
window.addEventListener("resize",resize);
function setWord(){
 const value=$("word").value.trim().replace(/\s+/g," ");
 if(!value){$("word").focus();return}
 word=Array.from(value).slice(0,18).join("");$("word").value=word;$("headline").textContent="«"+word+"»";draw();
}
$("setWord").addEventListener("click",setWord);
$("word").addEventListener("keydown",e=>{if(e.key==="Enter")setWord()});
document.querySelectorAll(".weapon").forEach(btn=>btn.addEventListener("click",()=>{
 selected=btn.dataset.item;document.querySelectorAll(".weapon").forEach(b=>b.setAttribute("aria-pressed",String(b===btn)));
}));
function position(e){
 const r=canvas.getBoundingClientRect();
 return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
}
canvas.addEventListener("pointerdown",e=>{
 const p=position(e),item=items[selected],dx=p.x-origin.x,dy=p.y-origin.y;
 const distance=Math.hypot(dx,dy);
 const duration=Math.max(650,Math.min(1500,distance*1.55));
 shots.push({x:origin.x,y:origin.y,sx:origin.x,sy:origin.y,tx:p.x,ty:p.y,t:0,duration,item,rotation:0});
 $("message").innerHTML="<strong>Летит.</strong> Уже ничего не исправить.";
 e.preventDefault();
});
function burst(x,y,item){
 const stain={x,y,item,rotation:Math.random()*Math.PI*2,scale:.8+Math.random()*.55};
 splats.push(stain);if(splats.length>45)splats.shift();
 for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3.4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:25+Math.random()*20,max:45,color:item.color,size:2+Math.random()*4})}
 count++;$("count").textContent=count;$("message").innerHTML="<strong>ШЛЁП.</strong> Попадание зафиксировано.";
}
function update(dt){
 const step=Math.min(dt/16.67,2.5);
 shots=shots.filter(s=>{
  s.t+=dt;
  const raw=Math.min(1,s.t/s.duration),ease=1-Math.pow(1-raw,2.15);
  s.x=s.sx+(s.tx-s.sx)*ease;s.y=s.sy+(s.ty-s.sy)*ease-Math.sin(raw*Math.PI)*Math.min(55,Math.hypot(s.tx-s.sx,s.ty-s.sy)*.09);
  s.rotation+=.12*step;
  if(raw>=1){burst(s.tx,s.ty,s.item);return false}return true;
 });
 particles=particles.filter(p=>p.life>0);
 particles.forEach(p=>{p.x+=p.vx*step;p.y+=p.vy*step;p.vy+=.08*step;p.life-=step});
}
function background(){
 ctx.fillStyle="#0d1422";ctx.fillRect(0,0,W,H);
 const glow=ctx.createRadialGradient(C.x,C.y,10,C.x,C.y,380);glow.addColorStop(0,"rgba(38,104,210,.18)");glow.addColorStop(1,"rgba(38,104,210,0)");ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="rgba(129,155,194,.07)";ctx.lineWidth=1;
 for(let x=24;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=24;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}
function target(){
 ctx.save();ctx.translate(C.x,C.y);
 ctx.shadowColor="#2878ff55";ctx.shadowBlur=45;
 const g=ctx.createRadialGradient(-32,-38,12,0,0,C.r);g.addColorStop(0,"#64a5ff");g.addColorStop(.65,"#347eff");g.addColorStop(1,"#1551ba");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,C.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,C.r-10,0,Math.PI*2);ctx.stroke();
 ctx.save();ctx.beginPath();ctx.arc(0,0,C.r-5,0,Math.PI*2);ctx.clip();
 splats.forEach(s=>{ctx.save();ctx.translate(s.x-C.x,s.y-C.y);ctx.rotate(s.rotation);ctx.globalAlpha=.83;ctx.font="54px Apple Color Emoji,Segoe UI Emoji,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(s.item.emoji,0,0);ctx.restore()});
 ctx.restore();
 ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="950 76px Inter,system-ui,sans-serif";
 let size=76;while(ctx.measureText(word).width>C.r*1.55&&size>17){size-=2;ctx.font="950 "+size+"px Inter,system-ui,sans-serif"}
 ctx.shadowColor="#09285a88";ctx.shadowBlur=8;ctx.fillText(word,0,3,C.r*1.55);
 ctx.restore();
}
function draw(){
 background();target();
 ctx.save();ctx.globalAlpha=.55;ctx.strokeStyle="#50617d";ctx.setLineDash([5,9]);ctx.beginPath();ctx.moveTo(origin.x,origin.y-15);ctx.lineTo(origin.x,origin.y-100);ctx.stroke();ctx.setLineDash([]);ctx.restore();
 shots.forEach(s=>{ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rotation);ctx.font="38px Apple Color Emoji,Segoe UI Emoji,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.shadowColor="#0009";ctx.shadowBlur=12;ctx.fillText(s.item.emoji,0,0);ctx.restore()});
 particles.forEach(p=>{ctx.save();ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.restore()});
}
function frame(t){const dt=last?t-last:16.67;last=t;update(dt);draw();requestAnimationFrame(frame)}
resize();requestAnimationFrame(frame);
$("clear").addEventListener("click",()=>{splats=[];particles=[];count=0;$("count").textContent="0";$("message").innerHTML="<strong>Чисто.</strong> Можно начинать заново.";draw()});
})();
</script>
</body>
</html>
